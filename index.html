<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Áp giao diện đã chọn trước khi vẽ để trang không nháy sai màu.
      Ảnh hero là LCP của trang chủ nên tải trước ngay khi đọc HTML, chỉ ở "/" và chỉ ảnh của giao diện đang dùng.
      srcset, sizes và media phải trùng với heroImages trong src/data/landing.ts, nếu không trình duyệt tải hai lần.
    -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('solar-theme')
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
        if (location.pathname !== '/') return
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var scene = dark ? 'night' : 'day'
        function preload(kind, widths, media, sizes) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.type = 'image/avif'
          l.media = media
          l.setAttribute(
            'imagesrcset',
            widths
              .map(function (w) {
                return '/images/hero/' + scene + '-' + kind + '-' + w + '.avif ' + w + 'w'
              })
              .join(', '),
          )
          l.setAttribute('imagesizes', sizes)
          l.setAttribute('fetchpriority', 'high')
          document.head.appendChild(l)
        }
        preload('wide', [1280, 1920, 2560, 3840], '(min-width: 768px)', '(min-width: 1024px) 100vw, 140vw')
        preload('crop', [640, 960, 1280, 1600], '(max-width: 767.98px)', '120vw')
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Giải pháp điện mặt trời cho ngôi nhà của bạn: khảo sát nhu cầu, tư vấn lắp đặt và quản lý bảo hành, bảo trì trên cùng một nền tảng."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Smart Solar | Giải pháp điện mặt trời cho ngôi nhà của bạn" />
    <meta
      property="og:description"
      content="Khảo sát nhu cầu, tư vấn lắp đặt và quản lý bảo hành, bảo trì trên cùng một nền tảng."
    />
    <title>Smart Solar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
